name: Ingest Jobs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: generated

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect jobs
        run: uv run scripts/collect.py

      # careers-data stores generated datasets separately from source code.
      
      - name: Clone careers-data
        run: |
          git clone \
            --depth 1 \
            https://x-access-token:${{ secrets.CAREERS_DATA_TOKEN }}@github.com/ZenYukti/careers-data.git

      - name: Update jobs database
        run: |
          cp generated/jobs.json careers-data/jobs.json

      - name: Commit updated jobs database
        run: |
          cd careers-data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No job database changes."
            exit 0
          fi

          git commit -m "chore(data): update jobs database"
          git push