name: Ingest Jobs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: generated

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Collect jobs
        run: uv run scripts/collect.py