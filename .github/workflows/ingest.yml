name: Ingest Jobs

on:
  workflow_dispatch:

  schedule:
  - cron: "30 4 * * *"   # 10:00 AM IST
  - cron: "30 13 * * *"  # 7:00 PM IST

  # github cron uses utc, 
  # so, 10:00 AM IST -> 04:30 AM UTC
  # and 07:00 PM IST -> 13:30 PM UTC

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: careers-data

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Clone the external data repository used to persist collected jobs.      
      
      - name: Clone careers-data
        run: |
          git clone \
            --depth 1 \
            https://x-access-token:${{ secrets.CAREERS_DATA_TOKEN }}@github.com/ZenYukti/careers-data.git

      - name: Collect jobs
        run: |
          uv run scripts/collect.py

      - name: Commit updated jobs database
        run: |
          cd careers-data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No job database changes."
            exit 0
          fi

          git commit -m "chore(data): update jobs database"

          git push