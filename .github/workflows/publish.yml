name: Publish Jobs

on:
  workflow_dispatch:

  # not starting simultaneously bcz race condition will occur if both workflows try to push to careers-data at the same time.
  
  # gives ingestion -> 10 mins to finish 
  
  schedule:
    - cron: "40 4 * * *"   # 10:10 AM IST
    - cron: "40 13 * * *"  # 7:10 PM IST

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DATA_DIR: careers-data

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Clone the external data repository used to persist publishing state.      
      
      - name: Clone careers-data
        run: |
          git clone \
            --depth 1 \
            https://x-access-token:${{ secrets.CAREERS_DATA_TOKEN }}@github.com/ZenYukti/careers-data.git

      - name: Publish jobs
        run: |
          uv run scripts/publish.py

      - name: Commit updated publishing state
        run: |
          cd careers-data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json queue.json
          
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No publishing state changes."
            exit 0
          fi

          git commit -m "chore(data): update publishing state"

          git push