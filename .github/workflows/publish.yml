name: Publish Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "40 4,8,14,19 * * *"

# Prevent concurrent runs from overlapping and conflicting on git push
# Applied (needed) after Workflow !261 (https://github.com/ZenYukti/careers-engine/actions/runs/41861967297)
concurrency:
  group: publish-jobs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # so we don't loose unnecessary github actions run-time CI minutes

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATA_DIR: careers-data
      PYTHONUNBUFFERED: "1"
      MAX_PUBLISH_PER_RUN: "4"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Clone the external data repository used to persist publishing state.
      - name: Clone careers-data
        run: |
          git clone \
            --depth 1 \
            https://x-access-token:${{ secrets.CAREERS_DATA_TOKEN }}@github.com/ZenYukti/careers-data.git

      - name: Publish jobs
        id: publish
        continue-on-error: true
        run: uv run scripts/publish.py

      - name: Commit updated publishing state
        if: always()
        run: |
          cd careers-data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add queue.json \
            delivery-history/discord.json \
            delivery-history/telegram.json

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No publishing state changes."
            exit 0
          fi

          git commit -m "chore(data): update publishing state"
          git pull --rebase origin main
          git push

      - name: Fail workflow if publishing failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "Publishing failed for one or more destinations."
          exit 1
